name: Bug report
description: Report a repeatable problem in Jeff
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, private user data, or security details here. Use the private process in SECURITY.md for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the visible result and why it is wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use made-up, non-sensitive messages where possible.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or deployment
      description: Add a commit SHA or deployment name if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, operating system, and any relevant model override.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and personal data from this report.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
